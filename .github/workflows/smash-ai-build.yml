name: Smash AI Windows build

on:
  push:
    branches:
      - smash-ai
  workflow_dispatch:

concurrency:
  group: smash-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-win-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Smash AI Python environment
        working-directory: tools/SmashAI
        run: python -m unittest -v test_smash_ai_env.py test_smash_ai_policy.py

      - name: Publish Windows x64
        shell: pwsh
        run: dotnet publish src/Ryujinx/Ryujinx.csproj -c Release -r win-x64 --self-contained true -o publish -p:Version=1.0.0-smash-ai

      - name: Add Smash AI tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/SmashAI-tools | Out-Null
          Copy-Item tools/SmashAI/test_bridge.py publish/SmashAI-tools/
          Copy-Item tools/SmashAI/smash_ai_env.py publish/SmashAI-tools/
          Copy-Item tools/SmashAI/smash_ai_policy.py publish/SmashAI-tools/
          Copy-Item tools/SmashAI/smash_ai_train.py publish/SmashAI-tools/
          Copy-Item tools/SmashAI/smash_ai_play.py publish/SmashAI-tools/
          Copy-Item tools/SmashAI/smash_ai_launcher.py publish/SmashAI-tools/
          Copy-Item tools/SmashAI/Launch-SmashAI.bat publish/SmashAI-tools/
          Copy-Item docs/SmashAI.md publish/SmashAI-tools/README.md
          Copy-Item tools/SmashAI/Launch-SmashAI.bat publish/Launch-SmashAI.bat
          Copy-Item tools/SmashAI/SmashAI.bat publish/SmashAI.bat
          Copy-Item tools/SmashAI/Install-SmashAI-ML.bat publish/Install-SmashAI-ML.bat
          Copy-Item "tools/SmashAI/RUN INSTRUCTIONS.txt" "publish/RUN INSTRUCTIONS.txt"

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Ryujinx-SmashAI-win-x64.zip

      - name: Upload host artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ryujinx-SmashAI-win-x64
          path: Ryujinx-SmashAI-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  guest-exporter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install cargo-skyline
        run: |
          cargo install --git https://github.com/jam1garner/cargo-skyline --force
          cargo-skyline skyline update-std

      - name: Build SSBU guest state exporter
        working-directory: tools/SmashAI/guest
        run: cargo-skyline skyline build --release

      - name: Package guest exporter
        run: |
          mkdir guest-artifact
          cp tools/SmashAI/guest/target/aarch64-skyline-switch/release/libsmash_ai_state.nro guest-artifact/
          cp tools/SmashAI/guest/README.md guest-artifact/README.md

      - name: Upload guest artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmashAI-SSBU-state-exporter
          path: guest-artifact
          if-no-files-found: error
          retention-days: 14
