name: Build SmashSync Windows x64

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: smashsync-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build required Ryujinx.LibHac package
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/drukoz/Zyujinx.git vendor/Zyujinx
          git -C vendor/Zyujinx sparse-checkout set LibHac-Decompiled
          $project = "vendor/Zyujinx/LibHac-Decompiled/LibHac.csproj"
          if (-not (Test-Path $project)) { throw 'LibHac.csproj was not found in the compatibility mirror.' }
          New-Item -ItemType Directory -Force vendor-packages | Out-Null
          dotnet pack $project -c Release -o vendor-packages -p:PackageId=Ryujinx.LibHac -p:PackageVersion=0.21.0-alpha.133
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore Windows x64
        run: dotnet restore src/Ryujinx/Ryujinx.csproj -r win-x64

      - name: Publish Windows x64
        run: dotnet publish src/Ryujinx/Ryujinx.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish -p:ExtraDefineConstants=DISABLE_UPDATER

      - name: Create default portable folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force publish/portable | Out-Null

      - name: Copy SmashSync docs
        shell: pwsh
        run: |
          Copy-Item docs/SmashSync.md publish/SMASHSYNC.md
          Copy-Item smashsync.example.json publish/smashsync.example.json

      - uses: actions/upload-artifact@v4
        with:
          name: SmashSync-win-x64
          path: publish
