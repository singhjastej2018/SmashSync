name: Build SmashSync Windows x64

on:
  push:
    branches: [ smashsync-netplay-public-deps ]
  workflow_dispatch:

concurrency:
  group: smashsync-public-deps-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore Windows x64
        run: dotnet restore src/Ryujinx/Ryujinx.csproj -r win-x64

      - name: Publish Windows x64
        run: dotnet publish src/Ryujinx/Ryujinx.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish

      - name: Create portable folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force publish/portable | Out-Null

      - name: Copy SmashSync docs
        shell: pwsh
        run: |
          Copy-Item docs/SmashSync.md publish/SMASHSYNC.md
          Copy-Item smashsync.example.json publish/smashsync.example.json

      - uses: actions/upload-artifact@v4
        with:
          name: SmashSync-win-x64
          path: publish
