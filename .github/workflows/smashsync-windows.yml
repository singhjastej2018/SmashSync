name: Build SmashSync Windows x64

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: smashsync-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build required Ryujinx.LibHac package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/runtime | Out-Null
          New-Item -ItemType Directory -Force vendor-packages | Out-Null
          Invoke-WebRequest -Uri "https://github.com/Leuconoe/Ryubing/releases/download/mcp-bridge-v0.2.0/Ryubing-MCP-Bridge-v0.2.0-win-x64.zip" -OutFile vendor/ryubing-runtime.zip
          Expand-Archive vendor/ryubing-runtime.zip -DestinationPath vendor/runtime -Force
          $libHac = Get-ChildItem vendor/runtime -Recurse -Filter LibHac.dll | Select-Object -First 1
          if (-not $libHac) {
            Write-Host "Archive contents:"
            Get-ChildItem vendor/runtime -Recurse | Select-Object -ExpandProperty FullName
            throw "LibHac.dll was not found in the reference Ryubing release."
          }

          New-Item -ItemType Directory -Force vendor/LibHacPackage/lib/net10.0 | Out-Null
          Copy-Item $libHac.FullName vendor/LibHacPackage/lib/net10.0/LibHac.dll

          @'
          <?xml version="1.0"?>
          <package>
            <metadata>
              <id>Ryujinx.LibHac</id>
              <version>0.21.0-alpha.133</version>
              <authors>Ryubing/LibHac contributors</authors>
              <description>Build-time compatibility package extracted from the public Ryubing Windows release.</description>
            </metadata>
            <files>
              <file src="lib\\net10.0\\LibHac.dll" target="lib\\net10.0" />
            </files>
          </package>
          '@ | Set-Content vendor/LibHacPackage/Ryujinx.LibHac.nuspec

          nuget pack vendor/LibHacPackage/Ryujinx.LibHac.nuspec -OutputDirectory vendor-packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore Windows x64
        run: dotnet restore src/Ryujinx/Ryujinx.csproj -r win-x64

      - name: Publish Windows x64
        run: dotnet publish src/Ryujinx/Ryujinx.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish -p:ExtraDefineConstants=DISABLE_UPDATER

      - name: Create default portable folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force publish/portable | Out-Null

      - name: Copy SmashSync docs
        shell: pwsh
        run: |
          Copy-Item docs/SmashSync.md publish/SMASHSYNC.md
          Copy-Item smashsync.example.json publish/smashsync.example.json

      - uses: actions/upload-artifact@v4
        with:
          name: SmashSync-win-x64
          path: publish
